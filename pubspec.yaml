name: qazvoice
description: On-device Kazakh text-to-speech and speech recognition for Flutter. Works offline after a one-time model download; playback, microphone and background downloads built in.
version: 0.0.4
homepage: https://github.com/eq-devs/qazvoice
repository: https://github.com/eq-devs/qazvoice
issue_tracker: https://github.com/eq-devs/qazvoice/issues
topics:
  - kazakh
  - text-to-speech
  - speech-recognition
  - offline
  - tts

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: kz.qazvoice
        pluginClass: QazvoicePlugin
      ios:
        pluginClass: QazvoicePlugin
