name: qazvoice_example
description: Demonstrates every API of the qazvoice plugin.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.5.0

dependencies:
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  qazvoice:
    path: ../
  share_plus: ^13.3.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
